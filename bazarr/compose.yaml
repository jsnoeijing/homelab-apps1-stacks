services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr

    environment:
      - PUID=2007
      - PGID=2000
      - TZ=Europe/Amsterdam
      - UMASK=002

    volumes:
      - /srv/docker/bazarr:/config
      - /srv/data/media:/data/media

    ports:
      - "6767:6767/tcp"

    restart: unless-stopped
