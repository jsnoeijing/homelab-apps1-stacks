services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true

    environment:
      - TZ=Europe/Amsterdam
      - LOG_LEVEL=info

    ports:
      - "127.0.0.1:5055:5055/tcp"

    volumes:
      - /srv/docker/seerr:/app/config

    networks:
      - default
      - media

    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/settings/public || exit 1"
      start_period: 20s
      interval: 15s
      timeout: 3s
      retries: 3

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    restart: unless-stopped

networks:
  media:
    external: true
